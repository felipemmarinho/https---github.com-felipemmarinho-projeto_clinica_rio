<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Modal Bootstrap</title>
    <!-- CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- <div class="container mt-5">
        
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#meuModal">
            Abrir Modal
        </button>
    </div> -->

    <!-- O Modal (Note o id="meuModal") -->
    <div class="modal fade" id="meuModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Título do Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>O corpo do modal vai aqui.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary">Salvar mudanças</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript do Bootstrap 5 (Necessário para o modal funcionar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Seleciona o elemento do modal pelo ID
        const meuModalEl = document.getElementById('meuModal');
        
        // 2. Cria a instância do modal do Bootstrap
        const meuModal = new bootstrap.Modal(meuModalEl);

        // Exemplo: Para abrir o modal automaticamente ou por uma função:
         //meuModal.show();

        // Exemplo: Para fechar o modal programaticamente:
        // meuModal.hide();
    </script>
</body>
</html>
